<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Urban Style | Inicio de sesión</title>
    <link rel="stylesheet" href="assets/styles.css">
    <script src="assets/login.js" defer></script>
</head>
<body class="login-page">
    <header class="topbar">
        <a class="wordmark" href="login.html" aria-label="Urban Style">URBAN<span>STYLE</span></a>
    </header>
    <main class="login-layout">
        <section class="login-panel" aria-labelledby="login-heading">
            <p class="eyebrow">ACCESO</p>
            <h2 id="login-heading">Iniciar sesión</h2>
            <form id="login-form">
                <label for="email">Correo electrónico</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="nombre@correo.com" required>
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Introduce una contraseña" required>
                <button class="primary-button" type="submit">Entrar <span aria-hidden="true">&#8594;</span></button>
                <p class="form-error" id="form-error" role="alert" hidden></p>
                <p class="demo-note">¿Has olvidado tu contraseña? <a href="reset-password.html">Recupérala aquí </a>.</p>
            </form>
        </section>
    </main>
</body>
</html>
